services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
    
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  app:
    build: .
    env_file:
      - .env
    ports: ["8080:8080"]
    volumes:
      - ./uploads:/app/uploads
    depends_on:
       db:
        condition: service_healthy
       redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  redis_data: